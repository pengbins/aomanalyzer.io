<!DOCTYPE html>
<html>

<head>
  <title>Visionular bitrate viewer</title>
  <style>
    .highcharts-figure,
    .highcharts-data-table table {
      min-width: 360px;
      max-width: 100%;
      margin: 1em auto;
    }

    .highcharts-data-table table {
      font-family: Verdana, sans-serif;
      border-collapse: collapse;
      border: 1px solid #EBEBEB;
      margin: 10px auto;
      text-align: center;
      width: 100%;
      max-width: 500px;
    }

    .highcharts-data-table caption {
      padding: 1em 0;
      font-size: 1.2em;
      color: #555;
    }

    .highcharts-data-table th {
      font-weight: 600;
      padding: 0.5em;
    }

    .highcharts-data-table td,
    .highcharts-data-table th,
    .highcharts-data-table caption {
      padding: 0.5em;
    }

    .highcharts-data-table thead tr,
    .highcharts-data-table tr:nth-child(even) {
      background: #f8f8f8;
    }

    .highcharts-data-table tr:hover {
      background: #f1f7ff;
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/highcharts@12.5.0/highcharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.5.0/modules/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.5.0/modules/exporting.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.5.0/modules/export-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.5.0/modules/accessibility.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.5.0/modules/xrange.js"></script>

<body>
  <div style="text-align: center;">
    <video id="videoA" width="480" controls style="vertical-align:left; max-height: 50vh;">
      Your browser does not support the video tag.
    </video>
  </div>
  <div style="text-align: center;">
    Video: <input id="v_file_A" type="file" onchange="playFile('v_file_A', 'videoA')" />
    <input id="playall" type="button" value="Play" onclick="playall()" />
  </div>
  <figure class="highcharts-figure">
    <div id="container"></div>
  </figure>
  <script>
    var series = [];
    var pktsize_datas = [];
    var query = window.location.search.substring(1);
    var vars = query.split("&");
    // console.log('vars: ', vars, 'len', vars.length);
    var video_idx = 0;
    function loadUrl(idx) {
      var pair = vars[idx].split("=");
      if (pair.length < 2) {
        return;
      }
      var video = document.getElementById(pair[0])
      var names = pair[1].split('/');
      var name = names[names.length - 1];
      fetch(pair[1])
        .then(r => r.blob())
        .then(myBlob => {
          video.src = URL.createObjectURL(myBlob);
          const vfile = new window.File([myBlob], name, { type: myBlob.type })
          console.log('name: ', name, 'blob', vfile);
          getPkts(vfile, pair[0]);
          if (idx < vars.length - 1) {
            loadUrl(idx + 1)
          }
        });
    }
    if (vars.length >= 1) {
      loadUrl(0);
    }
    var videoTags = ['videoA', 'videoB', 'videoC', 'videoD'];
    var videos = [];
    for (var tag of videoTags) {
      var v = document.getElementById(tag)
      videos.push(v);
    }
    function playall() {
      for (var v of videos) {
        v.play();
      }
      //setInterval(updateChart, 1000);
    }
    function playFile(id, tag) {
      var file = document.getElementById(id).files[0];
      if (!file) {
        return;
      }
      var v = document.getElementById(tag)
      v.src = URL.createObjectURL(file);
      getPkts(file, id);
    }
    function parseCSV(str) {
      var data = [];
      var lines = str.split('\n');
      console.log(lines[1])
      for (var line of lines) {
        var items = line.split(',');
        if (items[0] === "packet") {
          var codec_type = (items[1] === 'video' ? 1 : 0.8) + video_idx;
          var size = parseInt(items[2]);
          var pos = parseInt(items[3]);
          data.push(  { x: pos, x2: pos + size, y:  codec_type  }  );
        }
      }
      return data;
    }
    function updateAvgWin() {
      series = [];
      for (var seq of pktsize_datas) {
        var data =  seq.data;
        var newSeries = {
          name: seq.name,
          data: data,
          turboThreshold: 5000
        };
        series.push(newSeries);
      }
      updateChart();
    }

    function getPkts(file, vid) {
      var worker = new Worker('dist/probe_worker.js');
      worker.addEventListener('message', function (e) {
        var csvData = parseCSV(e.data.results);
        var newData = {
          name: e.data.name,
          data: csvData
        };
        pktsize_datas.push(newData);
        console.log("getPkts", newData.data[0], newData.data.length, vid);
        video_idx += 1;

        var lineData = csvData;
        var newSeries = {
          name: e.data.name,
          pointWidth: 20,
          id: vid,
          data: lineData,
        };
        series.push(newSeries);
        updateChart();
      }, false);
      //console.log('msg: ', file);
      var entries = "packet=pos,size,codec_type";
      worker.postMessage({ file: file, entries: entries });
    }

    function updateChart() {
      Highcharts.chart('container', {
        chart: {
          zoomType: 'x',
          type: 'xrange'
        },
        title: {
          text: 'video /audio position'
        },
        subtitle: {
          text: document.ontouchstart === undefined ?
            'Click and drag in the plot area to zoom in' : 'Pinch the chart to zoom in'
        },
        tooltip: {
          crosshairs: true,
          shared: true
        },
        xAxis: {
          type: 'float'
        },
        yAxis: {
          title: { text: "file" }
        },
        series: series
      });
    }
    updateChart();
  </script>

</body>

</html>
